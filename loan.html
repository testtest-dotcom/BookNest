<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookNest — выдача книги</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/layout.css"><link rel="stylesheet" href="styles/components.css"></head><body><header class="site-header"><a class="brand" href="index.html">BookNest</a><nav aria-label="Основная навигация"><a href="index.html">Каталог</a><a href="book.html">Книга</a><a href="loan.html" aria-current="page">Выдача</a></nav></header><main class="page"><h1>Заявка на выдачу книги</h1><p>Учебная демонстрационная форма: данные не отправляются на сервер.</p><form id="loan-form"><fieldset><legend>Данные читателя</legend><label for="reader">Имя читателя</label><input id="reader" name="reader" type="text" required minlength="2" maxlength="80"><label for="mail">Электронная почта</label><input id="mail" name="email" type="email" required><label for="phone">Телефон (11 цифр)</label><input id="phone" name="phone" type="tel" pattern="[0-9]{11}" required title="Введите 11 цифр"></fieldset><fieldset><legend>Книга и сроки</legend><label for="bookname">Выбор книги</label><select id="bookname" name="book" required><option value="">Выберите книгу</option><option>Евгений Онегин</option><option>Война и мир</option><option>Мастер и Маргарита</option></select><label for="date">Дата выдачи</label><input id="date" name="date" type="date" required><label for="days">Срок (дней)</label><input id="days" name="days" type="number" min="1" max="30" required><label for="notes">Примечания</label><textarea id="notes" name="notes" maxlength="400"></textarea></fieldset><button type="submit">Отправить заявку</button><p id="loan-info" role="status"></p></form></main><footer class="site-footer"><p>BookNest · <time datetime="2026">2026</time></p></footer><script type="module" src="forms.js"></script></body></html>

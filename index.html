<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookNest — каталог книг</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/layout.css"><link rel="stylesheet" href="styles/components.css"></head><body>
<header class="site-header"><a class="brand" href="index.html">BookNest</a><nav aria-label="Основная навигация"><a href="index.html" aria-current="page">Каталог</a><a href="book.html">Книга</a><a href="loan.html">Выдача</a><a href="#wishlist">Мой список <span id="wish-count">0</span></a></nav></header>
<main class="page"><h1>Каталог книг</h1><p class="intro">Откройте новую книгу и сохраните интересные произведения.</p>
<section class="catalog-layout" aria-label="Каталог и настройки"><aside class="filter-panel"><h2>Поиск и фильтры</h2><form id="filters" role="search"><label for="query">Название или автор</label><input id="query" name="query" type="search" placeholder="Например, Пушкин" minlength="2"><label for="genre">Жанр</label><select id="genre" name="genre"><option value="">Все жанры</option><option>Роман</option><option>Фантастика</option><option>Детектив</option><option>Научная литература</option><option>История</option></select><label for="sort">Сортировка</label><select id="sort" name="sort"><option value="title">Название А–Я</option><option value="year">Сначала новые</option><option value="rating">По рейтингу</option></select><label class="check"><input id="available" name="available" type="checkbox"> Только доступные</label><button type="reset" id="reset-filters">Сбросить</button></form></aside>
<section class="catalog-content" aria-label="Результаты"><h2>Все книги</h2><p id="count" aria-live="polite">6 книг</p><p id="status" role="status" aria-live="polite" hidden></p><section id="books" class="book-grid" aria-label="Карточки книг"></section><nav id="pager" class="pager" aria-label="Страницы каталога" hidden><button id="prev" type="button">Назад</button><span id="page-label">1</span><button id="next" type="button">Вперёд</button></nav><section id="wishlist" aria-label="Мой список"><h2>Мой список</h2><p id="wish-empty">Список пока пуст.</p><ul id="wish-items"></ul></section></section></section></main>
<footer class="site-footer"><p>BookNest · Учебный проект · <time datetime="2026">2026</time></p></footer><script type="module" src="api-main.js"></script></body></html>
